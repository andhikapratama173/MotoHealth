<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoCheck - Pencatatan Servis Motor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-gray-800 pb-6">
      <div>
        <h1 class="text-3xl font-bold text-amber-500 flex items-center gap-3">
          <i class="fa-solid fa-motorcycle"></i> MotoCheck
        </h1>
        <p class="text-gray-400 text-sm mt-1">Sistem Pemantauan Kesehatan & Jadwal Servis Motor</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
        <label class="block text-xs font-semibold text-amber-500 uppercase tracking-wider mb-1">Odometer Motor (KM)</label>
        <div class="flex items-center gap-2">
          <input type="number" id="current-odometer" class="bg-gray-900 text-2xl font-bold w-36 px-3 py-1 rounded-lg border border-gray-700 text-white focus:outline-none focus:border-amber-500" value="0">
          <button id="btn-update-odo" type="button" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold px-4 py-2 rounded-lg transition duration-200 cursor-pointer">
            Simpan
          </button>
        </div>
      </div>
    </header>

    <!-- Tombol Utama -->
    <div class="flex flex-wrap gap-3 mb-8">
      <button onclick="openModal('modal-add-component')" type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-xl flex items-center gap-2 shadow-lg transition cursor-pointer">
        <i class="fa-solid fa-plus pointer-events-none"></i> Tambah Komponen Baru
      </button>
      <button onclick="openServiceModal()" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-xl flex items-center gap-2 shadow-lg transition cursor-pointer">
        <i class="fa-solid fa-wrench pointer-events-none"></i> Catat Penggantian / Servis
      </button>
    </div>

    <!-- Status Komponen Grid -->
    <section class="mb-10">
      <h2 class="text-xl font-bold mb-4 text-gray-200 flex items-center gap-2">
        <i class="fa-solid fa-gauge-high text-amber-500"></i> Status Komponen
      </h2>
      <div id="component-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- Riwayat Penggantian -->
    <section class="bg-gray-800 rounded-2xl p-6 border border-gray-700">
      <h2 class="text-xl font-bold mb-4 text-gray-200 flex items-center gap-2">
        <i class="fa-solid fa-clock-rotate-left text-amber-500"></i> Riwayat Penggantian Part
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-900 text-gray-400 uppercase text-xs">
            <tr>
              <th class="py-3 px-4 rounded-l-lg">Tanggal</th>
              <th class="py-3 px-4">Komponen</th>
              <th class="py-3 px-4">Pada Odometer</th>
              <th class="py-3 px-4 rounded-r-lg">Catatan / Merek</th>
            </tr>
          </thead>
          <tbody id="history-list" class="divide-y divide-gray-700"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Modal Tambah Komponen Baru -->
  <div id="modal-add-component" class="fixed inset-0 bg-black/80 items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-amber-500">Tambah Komponen Baru</h3>
        <button onclick="closeModal('modal-add-component')" type="button" class="text-gray-400 hover:text-white p-2 cursor-pointer"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="form-add-component" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Nama Komponen</label>
          <input type="text" id="new-comp-name" required placeholder="Contoh: Kampas Rem Depan" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Interval Penggantian (KM)</label>
          <input type="number" id="new-comp-interval" required placeholder="Contoh: 10000" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Terakhir Diganti Pada KM</label>
          <input type="number" id="new-comp-last-km" required placeholder="Contoh: 0" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button onclick="closeModal('modal-add-component')" type="button" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg cursor-pointer">Batal</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg cursor-pointer">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Catat Servis/Penggantian -->
  <div id="modal-service" class="fixed inset-0 bg-black/80 items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-amber-500">Catat Penggantian Komponen</h3>
        <button onclick="closeModal('modal-service')" type="button" class="text-gray-400 hover:text-white p-2 cursor-pointer"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="form-service" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Pilih Komponen</label>
          <select id="service-comp-select" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Diganti Pada KM</label>
          <input type="number" id="service-km" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Merek / Catatan Spesifikasi</label>
          <input type="text" id="service-note" placeholder="Contoh: Shell Advance AX7 10W-40" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button onclick="closeModal('modal-service')" type="button" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg cursor-pointer">Batal</button>
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg cursor-pointer">Simpan Catatan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const defaultComponents = [
      { id: '1', name: 'Oli Mesin', interval: 3000, lastChangedKm: 0 },
      { id: '2', name: 'Oli Gardan', interval: 8000, lastChangedKm: 0 },
      { id: '3', name: 'Roller CVT', interval: 12000, lastChangedKm: 0 },
      { id: '4', name: 'V-Belt', interval: 24000, lastChangedKm: 0 },
      { id: '5', name: 'Busi', interval: 8000, lastChangedKm: 0 },
      { id: '6', name: 'Filter Udara', interval: 16000, lastChangedKm: 0 }
    ];

    let odometer = parseInt(localStorage.getItem('moto_odo')) || 0;
    let components = JSON.parse(localStorage.getItem('moto_components')) || defaultComponents;
    let history = JSON.parse(localStorage.getItem('moto_history')) || [];

    const currentOdoInput = document.getElementById('current-odometer');
    const componentContainer = document.getElementById('component-container');
    const historyList = document.getElementById('history-list');

    function openModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    function openServiceModal() {
      const select = document.getElementById('service-comp-select');
      select.innerHTML = components.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('service-km').value = odometer;
      openModal('modal-service');
    }

    function renderComponents() {
      componentContainer.innerHTML = '';
      components.forEach(comp => {
        const kmUsed = odometer - comp.lastChangedKm;
        const kmRemaining = comp.interval - kmUsed;
        const percentage = Math.max(0, Math.min(100, Math.round(((comp.interval - kmUsed) / comp.interval) * 100)));
        
        let statusBg = 'bg-emerald-500';
        let statusText = 'Sangat Baik';
        let badgeBg = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

        if (kmRemaining <= 0) {
          statusBg = 'bg-red-500';
          statusText = 'Wajib Ganti!';
          badgeBg = 'bg-red-500/10 text-red-400 border-red-500/20';
        } else if (percentage <= 25) {
          statusBg = 'bg-amber-500';
          statusText = 'Segera Ganti';
          badgeBg = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        }

        const card = document.createElement('div');
        card.className = 'bg-gray-800 p-5 rounded-xl border border-gray-700 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <div>
                <h3 class="font-bold text-lg text-white">${comp.name}</h3>
                <span class="text-xs text-gray-400">Interval: tiap ${comp.interval.toLocaleString('id-ID')} KM</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${badgeBg}">${statusText}</span>
                <button onclick="deleteComponent('${comp.id}')" type="button" class="text-gray-500 hover:text-red-400 text-xs p-1 cursor-pointer">
                  <i class="fa-solid fa-trash pointer-events-none"></i>
                </button>
              </div>
            </div>
            <div class="mb-3">
              <div class="flex justify-between text-xs font-semibold mb-1">
                <span class="text-gray-400">Sisa Umur</span>
                <span class="${kmRemaining <= 0 ? 'text-red-400 font-bold' : 'text-gray-200'}">
                  ${kmRemaining <= 0 ? 'Melewati batas ' + Math.abs(kmRemaining).toLocaleString('id-ID') + ' KM' : kmRemaining.toLocaleString('id-ID') + ' KM lagi'}
                </span>
              </div>
              <div class="w-full bg-gray-900 rounded-full h-2.5 overflow-hidden">
                <div class="${statusBg} h-2.5 rounded-full" style="width: ${percentage}%"></div>
              </div>
            </div>
          </div>
          <div class="text-xs text-gray-400 border-t border-gray-700/50 pt-3 mt-1 flex justify-between">
            <span>Terakhir diganti: <strong>${comp.lastChangedKm.toLocaleString('id-ID')} KM</strong></span>
            <span>Terpakai: <strong>${Math.max(0, kmUsed).toLocaleString('id-ID')} KM</strong></span>
          </div>
        `;
        componentContainer.appendChild(card);
      });
    }

    function deleteComponent(id) {
      if (confirm('Hapus komponen ini dari pemantauan?')) {
        components = components.filter(c => c.id !== id);
        localStorage.setItem('moto_components', JSON.stringify(components));
        renderComponents();
      }
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-500">Belum ada riwayat penggantian.</td></tr>`;
        return;
      }
      history.slice().reverse().forEach(item => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-700/30';
        row.innerHTML = `
          <td class="py-3 px-4 text-gray-400">${item.date}</td>
          <td class="py-3 px-4 font-semibold text-white">${item.compName}</td>
          <td class="py-3 px-4">${parseInt(item.km).toLocaleString('id-ID')} KM</td>
          <td class="py-3 px-4 text-gray-400">${item.note || '-'}</td>
        `;
        historyList.appendChild(row);
      });
    }

    document.getElementById('btn-update-odo').addEventListener('click', () => {
      const val = parseInt(currentOdoInput.value);
      if (!isNaN(val) && val >= 0) {
        odometer = val;
        localStorage.setItem('moto_odo', odometer);
        renderComponents();
      }
    });

    document.getElementById('form-add-component').addEventListener('submit', (e) => {
      e.preventDefault();
      components.push({
        id: Date.now().toString(),
        name: document.getElementById('new-comp-name').value,
        interval: parseInt(document.getElementById('new-comp-interval').value),
        lastChangedKm: parseInt(document.getElementById('new-comp-last-km').value)
      });
      localStorage.setItem('moto_components', JSON.stringify(components));
      renderComponents();
      e.target.reset();
      closeModal('modal-add-component');
    });

    document.getElementById('form-service').addEventListener('submit', (e) => {
      e.preventDefault();
      const compId = document.getElementById('service-comp-select').value;
      const km = parseInt(document.getElementById('service-km').value);
      const note = document.getElementById('service-note').value;
      const targetComp = components.find(c => c.id === compId);

      if (targetComp) {
        targetComp.lastChangedKm = km;
        localStorage.setItem('moto_components', JSON.stringify(components));
        history.push({
          date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
          compName: targetComp.name,
          km: km,
          note: note
        });
        localStorage.setItem('moto_history', JSON.stringify(history));

        if (km > odometer) {
          odometer = km;
          currentOdoInput.value = odometer;
          localStorage.setItem('moto_odo', odometer);
        }

        renderComponents();
        renderHistory();
      }
      e.target.reset();
      closeModal('modal-service');
    });

    // Initial Load
    currentOdoInput.value = odometer;
    renderComponents();
    renderHistory();
  </script>
</body>
</html>
