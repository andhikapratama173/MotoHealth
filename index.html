<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoCheck - Pencatatan Servis Motor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-gray-800 pb-6">
      <div>
        <h1 class="text-3xl font-bold text-amber-500 flex items-center gap-3">
          <i class="fa-solid fa-motorcycle"></i> MotoCheck
        </h1>
        <p class="text-gray-400 text-sm mt-1">Sistem Pemantauan Kesehatan & Jadwal Servis Motor</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
        <label class="block text-xs font-semibold text-amber-500 uppercase tracking-wider mb-1">Odometer Motor (KM)</label>
        <div class="flex items-center gap-2">
          <input type="number" id="current-odometer" class="bg-gray-900 text-2xl font-bold w-36 px-3 py-1 rounded-lg border border-gray-700 text-white focus:outline-none focus:border-amber-500" value="0">
          <button id="btn-update-odo" type="button" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold px-4 py-2 rounded-lg transition duration-200">
            Simpan
          </button>
        </div>
      </div>
    </header>

    <!-- Tombol Utama -->
    <div class="flex flex-wrap gap-3 mb-8">
      <button id="btn-open-add-modal" type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-xl flex items-center gap-2 shadow-lg transition cursor-pointer">
        <i class="fa-solid fa-plus pointer-events-none"></i> Tambah Komponen Baru
      </button>
      <button id="btn-open-service-modal" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-xl flex items-center gap-2 shadow-lg transition cursor-pointer">
        <i class="fa-solid fa-wrench pointer-events-none"></i> Catat Penggantian / Servis
      </button>
    </div>

    <!-- Status Komponen Grid -->
    <section class="mb-10">
      <h2 class="text-xl font-bold mb-4 text-gray-200 flex items-center gap-2">
        <i class="fa-solid fa-gauge-high text-amber-500"></i> Status Komponen
      </h2>
      <div id="component-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Riwayat Penggantian -->
    <section class="bg-gray-800 rounded-2xl p-6 border border-gray-700">
      <h2 class="text-xl font-bold mb-4 text-gray-200 flex items-center gap-2">
        <i class="fa-solid fa-clock-rotate-left text-amber-500"></i> Riwayat Penggantian Part
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-900 text-gray-400 uppercase text-xs">
            <tr>
              <th class="py-3 px-4 rounded-l-lg">Tanggal</th>
              <th class="py-3 px-4">Komponen</th>
              <th class="py-3 px-4">Pada Odometer</th>
              <th class="py-3 px-4 rounded-r-lg">Catatan / Merek</th>
            </tr>
          </thead>
          <tbody id="history-list" class="divide-y divide-gray-700">
            <!-- Rendered via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Modal Tambah Komponen Baru -->
  <div id="modal-add-component" class="fixed inset-0 bg-black/80 items-center justify-center p-4 z-50" style="display: none;">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-amber-500">Tambah Komponen Baru</h3>
        <button type="button" class="btn-close-modal text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl pointer-events-none"></i></button>
      </div>
      <form id="form-add-component" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Nama Komponen</label>
          <input type="text" id="new-comp-name" required placeholder="Contoh: Kampas Rem Depan" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Interval Penggantian (KM)</label>
          <input type="number" id="new-comp-interval" required placeholder="Contoh: 10000" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Terakhir Diganti Pada KM</label>
          <input type="number" id="new-comp-last-km" required placeholder="Contoh: 0" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" class="btn-close-modal bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">Batal</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Catat Servis/Penggantian -->
  <div id="modal-service" class="fixed inset-0 bg-black/80 items-center justify-center p-4 z-50" style="display: none;">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-amber-500">Catat Penggantian Komponen</h3>
        <button type="button" class="btn-close-modal text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl pointer-events-none"></i></button>
      </div>
      <form id="form-service" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Pilih Komponen</label>
          <select id="service-comp-select" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
            <!-- Dynamic options -->
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Diganti Pada KM</label>
          <input type="number" id="service-km" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Merek / Catatan Spesifikasi</label>
          <input type="text" id="service-note" placeholder="Contoh: Shell Advance AX7 10W-40" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" class="btn-close-modal bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">Batal</button>
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg">Simpan Catatan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
